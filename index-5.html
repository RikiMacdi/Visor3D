<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#140c16">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Jardín de tulipanes 360° — experiencia web inmersiva en 3D.">
  <title>Jardín de Tulipanes · 360°</title>
  <link rel="preload" as="image" href="./assets/garden.webp" fetchpriority="high">

  <style>
    :root{
      --ink:#fff8fb;
      --muted:rgba(255,248,251,.72);
      --glass:rgba(19,11,18,.52);
      --glass-strong:rgba(19,11,18,.76);
      --stroke:rgba(255,255,255,.14);
      --accent:#ffc4d7;
      --shadow:0 18px 60px rgba(0,0,0,.30);
    }
    *{box-sizing:border-box}
    html,body,#app{width:100%;height:100%;margin:0}
    body{
      overflow:hidden;
      background:#0a070b;
      color:var(--ink);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    button{font:inherit}
    #app{position:fixed;inset:0}
    canvas{display:block;width:100%;height:100%;touch-action:none}

    .hud{position:fixed;inset:0;pointer-events:none;z-index:10}
    .topbar{
      position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;
      display:flex;justify-content:space-between;align-items:flex-start;gap:12px
    }
    .glass{
      border:1px solid var(--stroke);background:var(--glass);
      box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)
    }
    .brand{padding:12px 15px;border-radius:18px;pointer-events:auto}
    .brand b{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
    .brand span{display:block;margin-top:4px;font-size:10px;color:var(--muted)}
    .status{padding:8px 11px;border-radius:999px;font-size:10px;color:var(--muted);white-space:nowrap}
    .status i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#ffd6ad;margin-right:6px;box-shadow:0 0 12px #ffd6ad}
    .hint{
      position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
      padding:11px 15px;border-radius:999px;color:#fff;background:rgba(20,11,17,.52);
      border:1px solid var(--stroke);font-size:11px;letter-spacing:.02em;white-space:nowrap;
      opacity:0;transition:opacity .4s ease;backdrop-filter:blur(12px)
    }
    .hint.show{opacity:1}

    .controls{
      position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));
      transform:translateX(-50%);display:flex;gap:7px;padding:8px;border-radius:20px;
      pointer-events:auto
    }
    .control{
      width:42px;height:42px;display:grid;place-items:center;border-radius:14px;
      border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);
      color:#fff;cursor:pointer;transition:.18s ease;user-select:none
    }
    .control:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25)}
    .control:active{transform:scale(.93)}
    .control.active{background:rgba(255,190,211,.18);border-color:rgba(255,200,220,.48)}
    .control:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

    .panel{
      position:absolute;right:14px;bottom:86px;width:min(280px,calc(100vw - 28px));
      padding:15px;border-radius:18px;opacity:0;transform:translateY(8px) scale(.98);
      pointer-events:none;transition:.22s ease
    }
    .panel.open{opacity:1;transform:none;pointer-events:auto}
    .panel h2{font-size:12px;margin:0 0 12px;letter-spacing:.08em;text-transform:uppercase}
    .panel label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11px;color:var(--muted);margin:10px 0}
    .panel input[type=range]{width:130px;accent-color:#ffc2d6}
    .panel .row{display:flex;justify-content:space-between;gap:8px}
    .smallbtn{padding:8px 10px;border-radius:11px;border:1px solid var(--stroke);background:rgba(255,255,255,.06);color:#fff;cursor:pointer;font-size:10px}
    .smallbtn.active{background:rgba(255,190,211,.18)}

    .vignette{
      position:absolute;inset:0;pointer-events:none;
      background:
        radial-gradient(circle at 50% 45%,transparent 42%,rgba(0,0,0,.10) 68%,rgba(0,0,0,.55) 100%),
        linear-gradient(180deg,rgba(20,8,18,.18),transparent 30%,transparent 72%,rgba(11,7,11,.25));
    }

    #loader{
      position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#0b070a;
      transition:opacity .6s ease,visibility .6s ease
    }
    #loader.done{opacity:0;visibility:hidden}
    .loader-box{width:min(330px,78vw);text-align:center}
    .flower{font-size:38px;filter:drop-shadow(0 0 18px rgba(255,188,211,.3));animation:pulse 1.5s ease-in-out infinite}
    .loader-title{margin-top:12px;font-size:13px;letter-spacing:.11em;text-transform:uppercase}
    .loader-sub{margin-top:6px;color:var(--muted);font-size:10px}
    .progress{height:2px;margin-top:17px;border-radius:10px;background:rgba(255,255,255,.1);overflow:hidden}
    .progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,#f3a7c5,#fff0c6);transition:width .2s ease}
    @keyframes pulse{50%{transform:scale(1.1)}}

    @media(max-width:600px){
      .topbar{left:10px;right:10px}
      .brand{padding:10px 12px;border-radius:15px}
      .brand span{font-size:9px}
      .status{display:none}
      .controls{gap:5px;padding:7px}
      .control{width:39px;height:39px;border-radius:13px}
      .hint{font-size:10px}
    }
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
    }
  </style>
</head>

<body>
  <div id="app" aria-label="Experiencia 3D del jardín de tulipanes"></div>

  <div id="loader" role="status" aria-live="polite">
    <div class="loader-box">
      <div class="flower">🌷</div>
      <div class="loader-title">Preparando el jardín</div>
      <div class="loader-sub" id="loaderText">Cargando paisaje y luz…</div>
      <div class="progress"><i id="progressBar"></i></div>
    </div>
  </div>

  <div class="hud">
    <div class="topbar">
      <div class="brand glass">
        <b>Jardín de Tulipanes</b>
        <span>Experiencia inmersiva · 360° · 3D</span>
      </div>
      <div class="status glass"><i></i><span id="statusText">3D activo</span></div>
    </div>

    <div class="hint" id="hint">Arrastra para mirar alrededor · pellizca para acercar</div>

    <div class="panel glass" id="panel" aria-hidden="true">
      <h2>Experiencia</h2>
      <label>Intensidad de luz <input id="lightRange" type="range" min=".6" max="1.5" step=".01" value="1.05"></label>
      <label>Velocidad automática <input id="speedRange" type="range" min="0" max="1.2" step=".01" value=".48"></label>
      <div class="row">
        <button class="smallbtn active" id="qualityAuto">Calidad automática</button>
        <button class="smallbtn" id="qualityLow">Rendimiento</button>
      </div>
    </div>

    <div class="controls glass" aria-label="Controles">
      <button class="control active" id="auto" title="Rotación automática" aria-label="Rotación automática">↻</button>
      <button class="control" id="gyro" title="Movimiento del teléfono" aria-label="Movimiento del teléfono">⌁</button>
      <button class="control" id="settings" title="Ajustes" aria-label="Ajustes">⚙</button>
      <button class="control" id="zoomIn" title="Acercar" aria-label="Acercar">＋</button>
      <button class="control" id="zoomOut" title="Alejar" aria-label="Alejar">－</button>
      <button class="control" id="fs" title="Pantalla completa" aria-label="Pantalla completa">⛶</button>
    </div>

    <div class="vignette"></div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <script>
    window.addEventListener("error", (event) => {
      const loader = document.getElementById("loader");
      const text = document.getElementById("loaderText");
      if (loader && !loader.classList.contains("done")) {
        text.textContent = "No se pudo iniciar la experiencia. Recarga la página.";
        loader.style.background = "#0b070a";
      }
    });
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const $ = (id) => document.getElementById(id);
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const isMobile = matchMedia("(pointer:coarse)").matches;

    const webglAvailable = (() => {
      try {
        const c = document.createElement("canvas");
        return !!(window.WebGL2RenderingContext && c.getContext("webgl2")) || !!c.getContext("webgl");
      } catch { return false; }
    })();

    const loader = $("loader");
    const progressBar = $("progressBar");
    const loaderText = $("loaderText");
    const hint = $("hint");
    const statusText = $("statusText");

    const setProgress = (value, text) => {
      progressBar.style.width = `${Math.max(0, Math.min(100, value))}%`;
      if (text) loaderText.textContent = text;
    };

    /* -----------------------------
       ESCENA / CÁMARA / RENDER
    ----------------------------- */
    if (!webglAvailable) {
      loaderText.textContent = "Tu navegador no tiene WebGL disponible.";
      setProgress(100);
      throw new Error("WebGL no disponible");
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b070a);
    scene.fog = new THREE.FogExp2(0x76505d, 0.014);

    const camera = new THREE.PerspectiveCamera(67, innerWidth / innerHeight, .05, 120);
    camera.position.set(0, 1.65, 7.4);

    const renderer = new THREE.WebGLRenderer({
      antialias: !isMobile,
      powerPreference: "high-performance"
    });
    renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.65 : 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = false;
    $("app").appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = .055;
    controls.enablePan = false;
    controls.minDistance = 3.15;
    controls.maxDistance = 12.5;
    controls.minPolarAngle = Math.PI * .23;
    controls.maxPolarAngle = Math.PI * .76;
    controls.target.set(0, 1.55, -2.1);
    controls.autoRotate = !reducedMotion;
    controls.autoRotateSpeed = .48;
    controls.rotateSpeed = -.34;
    controls.zoomSpeed = .75;

    /* -----------------------------
       ILUMINACIÓN CINEMATOGRÁFICA
    ----------------------------- */
    const hemi = new THREE.HemisphereLight(0xffe7dc, 0x25351f, 2.0);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xffd0b0, 2.1);
    sun.position.set(-8, 10, 4);
    scene.add(sun);

    const warm = new THREE.PointLight(0xffcda7, 18, 26, 2);
    warm.position.set(-3, 4.8, 1);
    scene.add(warm);

    const pink = new THREE.PointLight(0xffa9c9, 9, 24, 2);
    pink.position.set(4, 3.2, -7);
    scene.add(pink);

    /* -----------------------------
       FONDO FOTOGRÁFICO
       La foto se usa como capa de entorno.
    ----------------------------- */
    setProgress(15, "Cargando paisaje…");
    let texture;
    try {
      texture = await new THREE.TextureLoader().loadAsync("./assets/garden.webp");
    } catch (webpError) {
      texture = await new THREE.TextureLoader().loadAsync("./assets/garden.jpg");
    }
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.anisotropy = renderer.capabilities.getMaxAnisotropy();

    const backdrop = new THREE.Mesh(
      new THREE.CylinderGeometry(23, 23, 18, 192, 1, true),
      new THREE.MeshBasicMaterial({
        map: texture,
        side: THREE.BackSide,
        transparent: true,
        opacity: .88
      })
    );
    backdrop.position.y = 5.8;
    scene.add(backdrop);

    /* -----------------------------
       CIELO PROCEDURAL
    ----------------------------- */
    setProgress(35, "Construyendo el cielo…");

    const skyMaterial = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      transparent: true,
      depthWrite: false,
      uniforms: { uTime: { value: 0 } },
      vertexShader: `
        varying vec3 vWorld;
        void main(){
          vec4 wp = modelMatrix * vec4(position,1.0);
          vWorld = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: `
        varying vec3 vWorld;
        uniform float uTime;

        void main(){
          float h = clamp((vWorld.y - .8) / 18.0, 0.0, 1.0);

          vec3 horizon = vec3(.98,.68,.57);
          vec3 rose    = vec3(.91,.42,.49);
          vec3 violet  = vec3(.25,.14,.30);
          vec3 night   = vec3(.055,.065,.13);

          vec3 c = mix(horizon, rose, smoothstep(.03,.28,h));
          c = mix(c, violet, smoothstep(.28,.66,h));
          c = mix(c, night, smoothstep(.66,1.0,h));

          float glow = exp(-pow((h-.12)*7.0,2.0))*.11;
          c += vec3(1.0,.36,.20)*glow;

          float alpha = .34 + .07*sin(uTime*.08);
          gl_FragColor = vec4(c, alpha);
        }
      `
    });

    const sky = new THREE.Mesh(new THREE.SphereGeometry(21, 96, 48), skyMaterial);
    sky.position.y = 1.9;
    scene.add(sky);

    /* Sol suave del horizonte */
    const sunDisc = new THREE.Mesh(
      new THREE.SphereGeometry(.55, 32, 20),
      new THREE.MeshBasicMaterial({
        color: 0xffd5a6,
        transparent: true,
        opacity: .65
      })
    );
    sunDisc.position.set(-7.5, 6.1, -12);
    scene.add(sunDisc);

    /* -----------------------------
       NUBES 3D
    ----------------------------- */
    const clouds = new THREE.Group();
    const cloudMaterial = new THREE.MeshBasicMaterial({
      color: 0xffd9d0,
      transparent: true,
      opacity: .055,
      depthWrite: false
    });

    for(let i=0;i<18;i++){
      const cloud = new THREE.Mesh(
        new THREE.SphereGeometry(.85 + Math.random()*1.6, 18, 10),
        cloudMaterial
      );
      const a = Math.random()*Math.PI*2;
      const r = 9.5 + Math.random()*7;
      cloud.position.set(
        Math.cos(a)*r,
        6 + Math.random()*5.5,
        Math.sin(a)*r
      );
      cloud.scale.set(
        1.6 + Math.random()*2.6,
        .28 + Math.random()*.25,
        .65 + Math.random()*1.0
      );
      clouds.add(cloud);
    }
    scene.add(clouds);

    /* -----------------------------
       ESTRELLAS / POLVO DE LUZ
    ----------------------------- */
    const starCount = isMobile ? 100 : 180;
    const starPos = new Float32Array(starCount*3);
    for(let i=0;i<starCount;i++){
      const a = Math.random()*Math.PI*2;
      const r = 12 + Math.random()*7;
      starPos[i*3] = Math.cos(a)*r;
      starPos[i*3+1] = 7 + Math.random()*9;
      starPos[i*3+2] = Math.sin(a)*r;
    }
    const starGeometry = new THREE.BufferGeometry();
    starGeometry.setAttribute("position", new THREE.BufferAttribute(starPos,3));
    const stars = new THREE.Points(
      starGeometry,
      new THREE.PointsMaterial({
        color: 0xffead5,
        size: isMobile ? .03 : .036,
        transparent: true,
        opacity: .38
      })
    );
    scene.add(stars);

    /* -----------------------------
       TERRENO Y CAMINOS
    ----------------------------- */
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(21, 96),
      new THREE.MeshStandardMaterial({
        color: 0x33261f,
        roughness: .96,
        metalness: .01
      })
    );
    ground.rotation.x = -Math.PI/2;
    ground.position.y = -.05;
    scene.add(ground);

    const pathMaterial = new THREE.MeshStandardMaterial({
      color: 0x9b806d,
      roughness: 1,
      transparent: true,
      opacity: .48
    });

    function addPath(x,z,w,d,rot){
      const path = new THREE.Mesh(
        new THREE.PlaneGeometry(w,d),
        pathMaterial
      );
      path.rotation.x = -Math.PI/2;
      path.rotation.z = rot;
      path.position.set(x,.003,z);
      scene.add(path);
    }

    addPath(0,-3,2.25,15,.08);
    addPath(-5,-4,1.15,11,-.08);
    addPath(5,-5,1.2,12,.09);

    /* -----------------------------
       TULIPÁN 3D
    ----------------------------- */
    const palette = [
      0xf1a1bb,0xf7b8cd,0xffe0e8,
      0xfff1d8,0xe36d91,0xd84b74
    ];

    function makeTulip(color){
      const g = new THREE.Group();

      const stem = new THREE.Mesh(
        new THREE.CylinderGeometry(.022,.032,.82,7),
        new THREE.MeshStandardMaterial({
          color:0x416a43,
          roughness:.92
        })
      );
      stem.position.y=.41;
      g.add(stem);

      const leafMaterial = new THREE.MeshStandardMaterial({
        color:0x557c4c,
        roughness:.9,
        side:THREE.DoubleSide
      });

      const leaf1 = new THREE.Mesh(
        new THREE.CapsuleGeometry(.05,.42,4,7),
        leafMaterial
      );
      leaf1.scale.set(.48,.95,.15);
      leaf1.rotation.z=-.48;
      leaf1.rotation.x=.2;
      leaf1.position.set(.1,.34,.01);
      g.add(leaf1);

      const leaf2 = leaf1.clone();
      leaf2.rotation.z=.5;
      leaf2.position.x=-.08;
      g.add(leaf2);

      const bloom = new THREE.Group();
      const petalMat = new THREE.MeshStandardMaterial({
        color,
        roughness:.58,
        metalness:0
      });

      for(let i=0;i<6;i++){
        const a=i*Math.PI*2/6;
        const petal = new THREE.Mesh(
          new THREE.SphereGeometry(.18,12,11),
          petalMat
        );
        petal.scale.set(.56,.92,.34);
        petal.position.set(
          Math.cos(a)*.125,
          .91 + Math.sin(a)*.035,
          Math.sin(a)*.125
        );
        petal.rotation.y=-a;
        bloom.add(petal);
      }

      const center = new THREE.Mesh(
        new THREE.SphereGeometry(.10,10,8),
        new THREE.MeshStandardMaterial({
          color:0xffe4bd,
          roughness:.7
        })
      );
      center.position.y=.92;
      bloom.add(center);
      g.add(bloom);

      g.rotation.y=Math.random()*Math.PI*2;
      g.userData.wind=Math.random()*Math.PI*2;
      return g;
    }

    const flowerGroup = new THREE.Group();
    scene.add(flowerGroup);

    const flowerCount = isMobile ? 105 : 155;
    for(let i=0;i<flowerCount;i++){
      const z=-1.6-Math.random()*12.5;
      const tulip=makeTulip(palette[Math.floor(Math.random()*palette.length)]);
      tulip.position.set(
        (Math.random()-.5)*14,
        0,
        z
      );

      const depthScale = THREE.MathUtils.clamp(
        1.55 + (z+1.6)*.045,
        .65,
        1.55
      );
      tulip.scale.setScalar(
        depthScale*(.78+Math.random()*.35)
      );
      flowerGroup.add(tulip);
    }

    /* -----------------------------
       FAROLES
    ----------------------------- */
    function addLamp(x,z,s=1){
      const g=new THREE.Group();
      const metal=new THREE.MeshStandardMaterial({
        color:0x756d67,
        roughness:.65,
        metalness:.35
      });

      const pole=new THREE.Mesh(
        new THREE.CylinderGeometry(.035*s,.052*s,1.45*s,8),
        metal
      );
      pole.position.y=.72*s;
      g.add(pole);

      const glow=new THREE.Mesh(
        new THREE.SphereGeometry(.105*s,12,12),
        new THREE.MeshBasicMaterial({color:0xffdfaa})
      );
      glow.position.y=1.5*s;
      g.add(glow);

      const light=new THREE.PointLight(
        0xffd9aa,
        2.2*s,
        4.3*s,
        2
      );
      light.position.y=1.5*s;
      g.add(light);

      g.position.set(x,0,z);
      scene.add(g);
    }

    [
      [-6,-2.2,1],[-2.1,-3.4,.82],[2.2,-4.0,.82],
      [6,-2.3,1],[-7,-7,.76],[7,-7,.76]
    ].forEach(v=>addLamp(...v));

    /* -----------------------------
       PARTÍCULAS AMBIENTALES
    ----------------------------- */
    const dustCount=isMobile?180:330;
    const dustPos=new Float32Array(dustCount*3);
    for(let i=0;i<dustCount;i++){
      dustPos[i*3]=(Math.random()-.5)*19;
      dustPos[i*3+1]=.25+Math.random()*6.5;
      dustPos[i*3+2]=-2-Math.random()*14;
    }
    const dustGeometry=new THREE.BufferGeometry();
    dustGeometry.setAttribute("position",new THREE.BufferAttribute(dustPos,3));
    const dust=new THREE.Points(
      dustGeometry,
      new THREE.PointsMaterial({
        color:0xffead2,
        size:.032,
        transparent:true,
        opacity:.48
      })
    );
    scene.add(dust);

    setProgress(78, "Afinando iluminación y profundidad…");

    /* -----------------------------
       CALIDAD ADAPTATIVA
    ----------------------------- */
    let qualityMode="auto";
    let currentDpr=Math.min(devicePixelRatio,isMobile?1.65:2);

    function setQuality(mode){
      qualityMode=mode;
      currentDpr=mode==="low"?1:Math.min(devicePixelRatio,isMobile?1.65:2);
      renderer.setPixelRatio(currentDpr);
      renderer.setSize(innerWidth,innerHeight,false);

      $("qualityAuto").classList.toggle("active",mode==="auto");
      $("qualityLow").classList.toggle("active",mode==="low");
      statusText.textContent=mode==="low"?"Rendimiento":"3D activo";
    }

    $("qualityAuto").onclick=()=>setQuality("auto");
    $("qualityLow").onclick=()=>setQuality("low");

    /* -----------------------------
       UI
    ----------------------------- */
    $("auto").onclick=()=>{
      controls.autoRotate=!controls.autoRotate;
      $("auto").classList.toggle("active",controls.autoRotate);
    };

    $("zoomIn").onclick=()=>{
      camera.position.multiplyScalar(.88);
      controls.update();
    };

    $("zoomOut").onclick=()=>{
      camera.position.multiplyScalar(1.12);
      controls.update();
    };

    $("settings").onclick=()=>{
      const open=$("panel").classList.toggle("open");
      $("panel").setAttribute("aria-hidden",String(!open));
    };

    $("lightRange").oninput=(e)=>{
      renderer.toneMappingExposure=Number(e.target.value);
    };

    $("speedRange").oninput=(e)=>{
      controls.autoRotateSpeed=Number(e.target.value);
    };

    $("fs").onclick=async()=>{
      try{
        if(!document.fullscreenElement){
          await document.documentElement.requestFullscreen();
        }else{
          await document.exitFullscreen();
        }
      }catch(err){}
    };

    /* -----------------------------
       GIROSCOPIO
    ----------------------------- */
    let gyroActive=false;
    let orientationHandler=null;

    $("gyro").onclick=async()=>{
      try{
        if(!("DeviceOrientationEvent" in window)){
          hint.textContent="Este dispositivo no expone sensores de orientación.";
          hint.classList.add("show");
          setTimeout(()=>hint.classList.remove("show"),2400);
          return;
        }

        if(typeof DeviceOrientationEvent.requestPermission==="function"){
          const permission=await DeviceOrientationEvent.requestPermission();
          if(permission!=="granted") throw new Error("permission");
        }

        gyroActive=!gyroActive;
        $("gyro").classList.toggle("active",gyroActive);

        if(gyroActive){
          controls.autoRotate=false;
          $("auto").classList.remove("active");

          orientationHandler=(e)=>{
            const gamma=e.gamma||0;
            const beta=e.beta||45;

            controls.target.x=THREE.MathUtils.clamp(
              Math.sin(THREE.MathUtils.degToRad(gamma))*2.1,
              -2.1,2.1
            );

            controls.target.y=THREE.MathUtils.clamp(
              1.55+(beta-45)*.018,
              .8,2.7
            );
          };

          addEventListener("deviceorientation",orientationHandler,true);
        }else if(orientationHandler){
          removeEventListener("deviceorientation",orientationHandler,true);
          orientationHandler=null;
        }
      }catch(err){
        hint.textContent="El navegador bloqueó el acceso al movimiento.";
        hint.classList.add("show");
        setTimeout(()=>hint.classList.remove("show"),2600);
      }
    };

    /* -----------------------------
       TECLADO / ACCESIBILIDAD
    ----------------------------- */
    addEventListener("keydown",(e)=>{
      if(e.key===" "){
        e.preventDefault();
        controls.autoRotate=!controls.autoRotate;
        $("auto").classList.toggle("active",controls.autoRotate);
      }
      if(e.key==="Escape"){
        $("panel").classList.remove("open");
      }
    });

    /* -----------------------------
       RESIZE
    ----------------------------- */
    addEventListener("resize",()=>{
      camera.aspect=innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(currentDpr);
      renderer.setSize(innerWidth,innerHeight,false);
    });

    /* -----------------------------
       LOOP
    ----------------------------- */
    let last=performance.now();

    function animate(time){
      requestAnimationFrame(animate);

      const dt=Math.min((time-last)/1000,.05);
      last=time;

      skyMaterial.uniforms.uTime.value=time*.001;

      clouds.rotation.y+=dt*.0015;
      stars.rotation.y+=dt*.004;
      dust.rotation.y+=dt*.012;

      warm.position.x=Math.sin(time*.00032)*3.8;
      pink.position.z=Math.cos(time*.00025)*7;

      /* Brisa sutil sobre los tulipanes */
      for(const tulip of flowerGroup.children){
        tulip.rotation.z=
          Math.sin(time*.00125+tulip.userData.wind)*.012;
      }

      controls.update();
      renderer.render(scene,camera);
    }

    setProgress(100,"Listo.");
    requestAnimationFrame(()=>{
      loader.classList.add("done");
      hint.classList.add("show");
      setTimeout(()=>hint.classList.remove("show"),3600);
      animate(performance.now());
    });
  </script>
</body>
</html>
